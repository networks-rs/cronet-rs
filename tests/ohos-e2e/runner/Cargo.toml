[package]
name = "cronet-ohos-e2e-runner"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tokio-cronet = { path = "../../../crates/tokio-cronet", default-features = false }
futures-core = "0.3"
tokio = { version = "1.44", features = ["io-util", "rt-multi-thread", "sync", "time"] }

[features]
default = ["sse", "ws", "nqe", "network-binding"]
static = ["tokio-cronet/static"]
sse = ["tokio-cronet/sse"]
ws = ["tokio-cronet/ws"]
nqe = ["tokio-cronet/nqe"]
network-binding = ["tokio-cronet/network-binding"]

[workspace]
