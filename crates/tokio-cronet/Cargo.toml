[package]
name = "tokio-cronet"
description = "Safe Rust bindings for Chromium Cronet's native C API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1"
tokio-cronet-sys = { path = "../tokio-cronet-sys", version = "0.1.1", default-features = false }
futures-core = "0.3"
hickory-resolver = { version = "0.25.2", default-features = false, features = ["system-config", "tokio"], optional = true }
serde_json = "1"
tokio = { version = "1.44", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
brotli = "8.0.4"

[features]
default = ["dns"]
# Tokio-native DNS queries backed by Hickory. This is an application-side
# resolver and does not replace Chromium's resolver inside Cronet.
dns = ["dep:hickory-resolver"]
# Server-Sent Events client over Cronet UrlRequest streaming.
sse = []
# WebSocket client over Chromium's WebSocketChannel using the Cronet engine.
ws = []
# Network quality estimates derived from Cronet request-finished metrics.
nqe = []
# Engine-level network handle used by WebSocket (UrlRequest C API has no bind).
network-binding = []
# Shared linking is the default. This additive override propagates through the
# safe crate and selects the complete static native archive.
static = ["tokio-cronet-sys/static"]
native-example = []
native-tests = []
network-tests = ["native-tests"]

[[example]]
name = "get"
required-features = ["native-example"]

[lints]
workspace = true
