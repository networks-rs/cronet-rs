name: Cronet source builds

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-native:
    name: ${{ matrix.target }} source build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Synchronize only the pinned Cronet source closure
        run: cargo xtask sync
      - name: Build shared and static Cronet from source
        run: cargo xtask build --release --linkage both --target ${{ matrix.target }}
      - name: Test static source linkage
        shell: bash
        run: |
          export CRONET_SOURCE_DIR="$PWD/.cronet/chromium/src"
          export CRONET_LIB_DIR="$CRONET_SOURCE_DIR/out/cronet-rs/$(printf '%s' '${{ matrix.target }}' | tr -c '[:alnum:]' '_')"
          export MACOSX_DEPLOYMENT_TARGET=12.0
          cargo test -p cronet --features static,native-tests --test e2e_local --test native_smoke -- --test-threads=1
      - name: Test shared source linkage
        shell: bash
        run: |
          export CRONET_SOURCE_DIR="$PWD/.cronet/chromium/src"
          export CRONET_LIB_DIR="$CRONET_SOURCE_DIR/out/cronet-rs/$(printf '%s' '${{ matrix.target }}' | tr -c '[:alnum:]' '_')"
          export MACOSX_DEPLOYMENT_TARGET=12.0
          export PATH="$CRONET_LIB_DIR:$PATH"
          export LD_LIBRARY_PATH="$CRONET_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="$CRONET_LIB_DIR${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          cargo test -p cronet --features native-tests --test e2e_local --test native_smoke -- --test-threads=1
      - name: Require public HTTP/2 and QUIC protocols
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          export CRONET_SOURCE_DIR="$PWD/.cronet/chromium/src"
          export CRONET_LIB_DIR="$CRONET_SOURCE_DIR/out/cronet-rs/$(printf '%s' '${{ matrix.target }}' | tr -c '[:alnum:]' '_')"
          export LD_LIBRARY_PATH="$CRONET_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export CRONET_E2E_REQUIRE_QUIC=1
          cargo test -p cronet --features network-tests --test e2e_network -- --test-threads=1

  android-source:
    name: Android ${{ matrix.target }} source build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            llvm-target: aarch64-linux-android
          - target: armv7-linux-androideabi
            llvm-target: armv7a-linux-androideabi
          - target: x86_64-linux-android
            llvm-target: x86_64-linux-android
            runtime-e2e: true
          - target: i686-linux-android
            llvm-target: i686-linux-android
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Set up JDK for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and NDK
        # v4.0.1; pin the community action because it downloads and executes
        # Android command-line tools before the repository build begins.
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: 12266719
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            build-tools;35.0.0
            platforms;android-35
            ndk;27.1.12297006
      - name: Export the pinned Android NDK
        shell: bash
        run: |
          sdk_root=${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root was not exported}}
          ndk="$sdk_root/ndk/27.1.12297006"
          test -f "$ndk/source.properties"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Synchronize only the pinned Cronet source closure
        run: cargo xtask sync --target "${{ matrix.target }}"
      - name: Build shared and static Cronet
        run: cargo xtask build --release --linkage both --target "${{ matrix.target }}"
      - name: Link final Rust Android libraries
        shell: bash
        run: |
          linker_env=CARGO_TARGET_$(printf '%s' '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')_LINKER
          linker="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.llvm-target }}23-clang"
          export CRONET_SOURCE_DIR="$PWD/.cronet/chromium/src"
          export CRONET_LIB_DIR="$CRONET_SOURCE_DIR/out/cronet-rs/$(printf '%s' '${{ matrix.target }}' | tr -c '[:alnum:]' '_')"
          env "$linker_env=$linker" cargo build --manifest-path tests/mobile-e2e/runner/Cargo.toml \
            --target '${{ matrix.target }}' --release
          env "$linker_env=$linker" cargo build --manifest-path tests/mobile-e2e/runner/Cargo.toml \
            --target '${{ matrix.target }}' --release --features static
      - name: Run dynamic and static Tokio E2E on Android Emulator
        if: matrix.runtime-e2e
        shell: bash
        run: |
          sdkmanager 'emulator' 'system-images;android-34;google_apis;x86_64'
          echo no | avdmanager create avd --force --name cronet-rs-e2e \
            --package 'system-images;android-34;google_apis;x86_64'
          sudo chmod 666 /dev/kvm
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd cronet-rs-e2e \
            -no-window -no-audio -no-snapshot-save >android-emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          adb wait-for-device
          for _ in $(seq 1 180); do
            [[ $(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') == 1 ]] && break
            kill -0 "$emulator_pid"
            sleep 1
          done
          [[ $(adb shell getprop sys.boot_completed | tr -d '\r') == 1 ]]
          ANDROID_E2E_TARGET=x86_64-linux-android ANDROID_E2E_LINKAGE=dynamic \
            tests/mobile-e2e/android/run.sh
          ANDROID_E2E_TARGET=x86_64-linux-android ANDROID_E2E_LINKAGE=static \
            tests/mobile-e2e/android/run.sh

  ios-source:
    name: iOS ${{ matrix.target }} source build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-ios
          - runner: macos-15
            target: aarch64-apple-ios-sim
            runtime-e2e: true
          - runner: macos-15-intel
            target: x86_64-apple-ios
            runtime-e2e: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Synchronize only the pinned Cronet source closure
        run: cargo xtask sync --target "${{ matrix.target }}"
      - name: Build shared and static Cronet
        run: cargo xtask build --release --linkage both --target "${{ matrix.target }}"
      - name: Link final Rust iOS libraries
        if: ${{ !matrix.runtime-e2e }}
        shell: bash
        run: |
          export CRONET_SOURCE_DIR="$PWD/.cronet/chromium/src"
          export CRONET_LIB_DIR="$CRONET_SOURCE_DIR/out/cronet-rs/$(printf '%s' '${{ matrix.target }}' | tr -c '[:alnum:]' '_')"
          cargo build --manifest-path tests/mobile-e2e/runner/Cargo.toml \
            --target '${{ matrix.target }}' --release
          cargo build --manifest-path tests/mobile-e2e/runner/Cargo.toml \
            --target '${{ matrix.target }}' --release --features static
      - name: Run dynamic and static Tokio E2E on iOS Simulator
        if: matrix.runtime-e2e
        shell: bash
        run: |
          IOS_E2E_TARGET='${{ matrix.target }}' IOS_E2E_LINKAGE=dynamic \
            tests/mobile-e2e/ios/run.sh
          IOS_E2E_TARGET='${{ matrix.target }}' IOS_E2E_LINKAGE=static \
            tests/mobile-e2e/ios/run.sh

  publish-check:
    name: Rust source crate publication check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check crate contents and metadata
        run: cargo package --workspace --allow-dirty --no-verify
