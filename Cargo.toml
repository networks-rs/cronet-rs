[workspace]
members = ["crates/tokio-cronet", "crates/tokio-cronet-sys", "xtask"]
default-members = ["crates/tokio-cronet", "crates/tokio-cronet-sys"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/southorange/cronet-rs"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
