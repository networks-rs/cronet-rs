[package]
name = "tokio-cronet-src"
description = "Pinned Cronet source and native build support for tokio-cronet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autobins = false
include = ["Cargo.toml", "README.md", "SOURCE.lock", "filter_deps.py", "src/**/*.rs", "vendor/**"]

[dependencies]
fs2 = "0.4"

[lib]
name = "tokio_cronet_src"
path = "src/main.rs"

[[bin]]
name = "xtask"
path = "src/bin/xtask.rs"

[lints]
workspace = true
